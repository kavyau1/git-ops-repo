apiVersion: apps/v1
kind: Deployment
metadata:
  name: raja-deployment
  namespace: test-notation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raja
  template:
    metadata:
      labels:
        app: raja
    spec:
      containers:
      - name: raja
        image: 490167669940.dkr.ecr.ap-southeast-1.amazonaws.com/app-mesh:latest@sha256:5348f5bb2bff07b91a95cd9ee47cad4dd1b123bab40a3bbd3ec3a058a881b0d8
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: raja
  namespace: test-notation
spec:
  ports:
  - name: http-port
    protocol: TCP
    port: 80
    targetPort: 8080
  selector:
    app: raja
  type: ClusterIP
